<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Préstamos</title>
    <h:outputStylesheet library="css" name="estilos.css"/>
</h:head>

<h:body>

<div class="contenedor">

    <h1>Registro de Préstamos</h1>

    <h:form id="formPrestamo"> 
        <h:messages globalOnly="true" styleClass="mensaje"/>

        <div class="campo">
            <h:outputLabel value="ID Alumno:" for="alumno"/>

            <h:selectOneMenu id="alumno"
                             value="#{prestamoBean.usuarioId}"
                             required="true"
                             requiredMessage="Seleccione un alumno"
                             styleClass="input">
                <f:selectItem itemLabel="-- Seleccione un Alumno --" itemValue="" />
                <f:selectItems value="#{prestamoBean.usuariosDisponibles}" var="usr"
                               itemValue="#{usr.id}" itemLabel="#{usr.nombre}" />
                <f:validator validatorId="maxPrestamosValidator" />
            </h:selectOneMenu>

            <h:message for="alumno" styleClass="error"/>
        </div>

        <div class="campo">
            <h:outputLabel value="ID Libro:" for="libro"/>
            <h:selectOneMenu id="libro"
                             value="#{prestamoBean.libroId}"
                             required="true"
                             requiredMessage="Seleccione un libro"
                             styleClass="input">
                <f:selectItem itemLabel="-- Seleccione un Libro --" itemValue="" />
                <f:selectItems value="#{prestamoBean.librosDisponibles}" var="lib"
                               itemValue="#{lib.id}" itemLabel="#{lib.titulo}" />
            </h:selectOneMenu>

            <h:message for="libro" styleClass="error"/>
        </div>

        <h:commandButton value="Prestar"
                         action="#{prestamoBean.registrarPrestamo()}"
                         styleClass="boton"/>

        <br/><br/>

        <h:button value="Volver"
                  outcome="menu.xhtml"
                  styleClass="botonSecundario"/>

    </h:form>

    <h:dataTable value="#{prestamoBean.todosPrestamos}" var="prestamo" styleClass="tabla-registros" rendered="#{not empty prestamoBean.todosPrestamos}">
        <h:column>
            <f:facet name="header">ID</f:facet>
            #{prestamo.id}
        </h:column>
        <h:column>
            <f:facet name="header">Alumno</f:facet>
            #{prestamo.usuario.nombre}
        </h:column>
        <h:column>
            <f:facet name="header">Libro</f:facet>
            #{prestamo.libro.titulo}
        </h:column>
        <h:column>
            <f:facet name="header">Fecha Préstamo</f:facet>
            <h:outputText value="#{prestamo.fechaPrestamo}">
                <f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
            </h:outputText>
        </h:column>
        <h:column>
            <f:facet name="header">Fecha Devolución</f:facet>
            <h:outputText value="#{prestamo.fechaDevolucionEsperada}">
                <f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
            </h:outputText>
        </h:column>
        <h:column>
            <f:facet name="header">Estado</f:facet>
            <span class="badge badge-#{prestamo.estado.toString().toLowerCase()}">
                #{prestamo.estado}
            </span>
        </h:column>
    </h:dataTable>

</div>
    </h:body>
</html>
